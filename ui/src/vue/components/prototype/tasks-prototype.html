<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks prototype v4 — wayfinder #13 (PROTOTYPE)</title>
<style>
  /* ============================================================
     Shelley design tokens (mirrored from ui/src/styles.css)
     ============================================================ */
  :root {
    --primary: #2563eb; --primary-dark: #1d4ed8;
    --bg-base: #ffffff; --bg-secondary: #f9fafb; --bg-tertiary: #f3f4f6; --bg-hover: #f3f4f6;
    --border: #e5e7eb; --code-bg: #eceef2;
    --text-primary: #111827; --text-secondary: #6b7280; --text-tertiary: #9ca3af;
    --success-bg: #f0fdf4; --success-border: #bbf7d0; --success-text: #166534;
    --error-bg: #fef2f2; --error-border: #fecaca; --error-text: #991b1b;
    --warning-bg: #fffbeb; --warning-border: #fcd34d; --warning-text: #92400e;
    --blue-bg: #eff6ff; --blue-border: #bfdbfe; --blue-text: #1e40af;
    --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
    --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  html.dark {
    --bg-base: #1f2937; --bg-secondary: #111827; --bg-tertiary: #374151; --bg-hover: #374151;
    --border: #374151; --code-bg: #414a59;
    --text-primary: #f9fafb; --text-secondary: #9ca3af; --text-tertiary: #6b7280;
    --success-bg: rgba(34,197,94,.1); --success-border: rgba(34,197,94,.3); --success-text: #86efac;
    --error-bg: rgba(239,68,68,.1); --error-border: rgba(239,68,68,.3); --error-text: #fca5a5;
    --warning-bg: rgba(251,191,36,.15); --warning-border: #fbbf24; --warning-text: #fcd34d;
    --blue-bg: rgba(59,130,246,.1); --blue-border: rgba(59,130,246,.3); --blue-text: #93c5fd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--text-primary); background: var(--bg-base); font-size: 14px; line-height: 1.5; }
  .shell { display: flex; flex-direction: column; height: 100vh; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); }
  .header-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .header-actions { display: flex; align-items: center; gap: 0.5rem; }
  .icon { width: 1rem; height: 1rem; }
  /* Split button: [+] New conversation | [task] New task */
  .split-btn { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 9999px; background: var(--bg-secondary); overflow: hidden; }
  .split-half { display: inline-flex; align-items: center; justify-content: center; width: 2.25rem; height: 2.25rem; border: none; background: none; color: var(--text-primary); cursor: pointer; }
  .split-half:hover { background: var(--bg-hover); }
  .split-divider { width: 1px; height: 1.25rem; background: var(--border); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 1rem; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); padding: 0.5rem 1rem; font-size: 0.875rem; cursor: pointer; font-family: var(--font); }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--primary); }
  .content { flex: 1; overflow-y: auto; }

  button { font-family: var(--font); }
  .btn { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 0.375rem; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); padding: 0.4rem 0.8rem; font-size: 0.8125rem; cursor: pointer; }
  .btn:hover { background: var(--bg-hover); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tag { display: inline-flex; align-items: center; gap: 0.1rem; font-size: 0.75rem; line-height: 1.2; color: var(--blue-text); background: var(--blue-bg); border: 1px solid var(--blue-border); border-radius: 9999px; padding: 0.1rem 0.5rem; white-space: nowrap; }
  .tag .hash { opacity: 0.6; }
  .tag.done-tag { color: var(--success-text); background: var(--success-bg); border-color: var(--success-border); }
  .missing-badge { font-size: 0.6875rem; color: var(--warning-text); background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 9999px; padding: 0 0.4rem; white-space: nowrap; }
  .mono { font-family: var(--mono); font-size: 0.75rem; color: var(--text-secondary); }
  .dir-name { color: var(--text-secondary); }
  .git-dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: var(--green-600, #16a34a); flex-shrink: 0; }
  .cwd-dot { width: 0.5rem; height: 0.5rem; border-radius: 1px; background: var(--text-tertiary); flex-shrink: 0; }
  .thread-badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; color: var(--primary); background: var(--bg-base); border: 1px solid var(--blue-border); border-radius: 9999px; padding: 0.1rem 0.5rem; white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-family: var(--font); }
  .thread-badge:hover { background: var(--blue-bg); border-color: var(--primary); }
  .thread-badge .arrow { opacity: 0.7; flex-shrink: 0; }
  .thread-badge .slug { overflow: hidden; text-overflow: ellipsis; }
  /* done: only the title dims + strikes; the rest of the row stays normal
     (thread badge, dir, tags all fully visible/clickable) */
  .is-done .task-title { text-decoration: line-through; color: var(--text-tertiary); }

  /* ============================================================
     Filters: one line, overflow-x scrollable
     ============================================================ */
  .filters-row { padding: 0.75rem 1.5rem 0; }
  .filters { display: flex; gap: 0.4rem; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; padding-bottom: 0.25rem; }
  .filter { flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.375rem; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); padding: 0.25rem 0.7rem; border-radius: 9999px; cursor: pointer; font-size: 0.8125rem; }
  .pill-favicon { width: 0.875rem; height: 0.875rem; border-radius: 0.1875rem; flex-shrink: 0; }
  .filter:hover { background: var(--bg-hover); color: var(--text-primary); }
  .filter.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* ============================================================
     Task grid: desktop two columns, mobile single column
     ============================================================ */
  .task-grid { display: grid; gap: 0.5rem 1.5rem; padding: 0.75rem 1.5rem 2rem; }
  /* DOM order = handled, idle, done (mobile order per feedback) */
  .group { min-width: 0; }
  .group-handled { order: 1; }
  .group-idle { order: 2; }
  .group-done { order: 3; }
  .group-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); padding: 0.5rem 0.5rem 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
  .group-label .n { font-weight: 500; color: var(--text-tertiary); }
  .group-body { display: flex; flex-direction: column; gap: 0.125rem; }
  .group-empty { font-size: 0.8125rem; color: var(--text-tertiary); padding: 0.5rem; border: 1px dashed var(--gray-300); border-radius: 0.375rem; text-align: center; }
  @media (min-width: 769px) {
    .task-grid { grid-template-columns: 1fr 1fr; align-items: start; }
    .group-idle { grid-column: 1; grid-row: 1 / span 2; }
    .group-handled { grid-column: 2; grid-row: 1; }
    .group-done { grid-column: 2; grid-row: 2; }
  }

  .row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.75rem; border-radius: 0.375rem; border: 1px solid transparent; }
  .row:hover { background: var(--bg-hover); }
  .row .main { flex: 1; min-width: 0; }
  .row .task-title { font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.15rem; flex-wrap: wrap; }
  .row .row-actions { display: none; align-items: center; gap: 0.25rem; }
  .row:hover .row-actions { display: inline-flex; }
  .icon-btn { border: none; background: none; color: var(--text-secondary); cursor: pointer; border-radius: 0.25rem; padding: 0.25rem; display: inline-flex; font-size: 0.8125rem; }
  .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .empty-all { text-align: center; padding: 4rem 1rem; color: var(--text-secondary); border: 1px dashed var(--gray-300); border-radius: 0.5rem; margin: 1.5rem; }
  .empty-all .big { font-size: 1.25rem; margin-bottom: 0.25rem; color: var(--text-primary); }

  /* ============================================================
     Modal: floating dropdown under the header button
     ============================================================ */
  .modal-wrap { position: fixed; top: 3.4rem; right: 0.75rem; z-index: 60; display: none; }
  .modal-wrap.on { display: block; animation: drop 0.15s ease-out; }
  @keyframes drop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal { width: 24rem; max-width: calc(100vw - 1.5rem); background: var(--bg-base); border: 1px solid var(--border); border-radius: 0.625rem; box-shadow: 0 12px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; max-height: calc(100vh - 4rem); }
  .modal-title { font-size: 0.9375rem; font-weight: 600; margin: 0; }
  .modal-body { padding: 0.875rem 1rem; overflow-y: auto; }
  .modal-body .modal-title { font-size: 0.9375rem; font-weight: 600; margin: 0 0 0.75rem; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.625rem 1rem; border-top: 1px solid var(--border); }
  .field { margin-bottom: 0.75rem; }
  .field label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
  .field .req { color: var(--error-text); }
  .input { width: 100%; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--bg-base); color: var(--text-primary); padding: 0.5rem 0.75rem; font-size: 0.875rem; outline: none; font-family: var(--font); }
  .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .input.err { border-color: var(--error-text); }
  .field-error { color: var(--error-text); font-size: 0.75rem; margin-top: 0.25rem; }
  .tag-hint { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.375rem; min-height: 1.25rem; }
  .tag-hint .lbl { font-size: 0.6875rem; color: var(--text-tertiary); }
  /* Directory select + icon-only Browse on one line */
  .dir-row { display: flex; gap: 0.375rem; align-items: center; }
  .select-wrap { position: relative; flex: 1; min-width: 0; }
  .select-wrap select { width: 100%; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--bg-base); color: var(--text-primary); padding: 0.5rem 2rem 0.5rem 0.75rem; font-size: 0.875rem; outline: none; appearance: none; cursor: pointer; font-family: var(--font); text-overflow: ellipsis; }
  .select-wrap::after { content: "▾"; position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; font-size: 0.75rem; }
  .select-wrap select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .browse-btn { flex-shrink: 0; width: 2.25rem; height: 2.25rem; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; }
  .browse-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .field .dir-note { font-size: 0.6875rem; color: var(--text-tertiary); margin-top: 0.3rem; }

  /* ---- Toast ---- */
  .toast { position: fixed; bottom: 4rem; left: 50%; transform: translateX(-50%); z-index: 110; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.875rem; font-size: 0.8125rem; color: var(--text-primary); box-shadow: 0 6px 24px rgba(0,0,0,0.18); display: none; white-space: nowrap; }
  .toast.on { display: block; }

  .prototype-note { position: fixed; top: 0; left: 0; right: 0; z-index: 90; background: var(--warning-bg); color: var(--warning-text); border-bottom: 1px solid var(--warning-border); font-size: 0.6875rem; text-align: center; padding: 0.2rem; font-family: var(--mono); }
  .prototype-note .theme-btn { margin-left: 0.75rem; border: 1px solid var(--warning-border); background: none; color: var(--warning-text); border-radius: 9999px; font-size: 0.6875rem; cursor: pointer; padding: 0.05rem 0.4rem; }
  body { padding-top: 1.35rem; }
</style>
</head>
<body>
  <div class="prototype-note">PROTOTYPE v4 · wayfinder #13 · throwaway <button class="theme-btn" data-theme>☀/🌙</button></div>

  <div class="shell">
    <header class="header">
      <h1 class="header-title">Shelley</h1>
      <div class="header-actions">
        <div class="split-btn" data-split>
          <button class="split-half" data-new-conv title="New conversation" aria-label="New conversation">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          </button>
          <span class="split-divider"></span>
          <button class="split-half" data-open title="New task" aria-label="New task">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
          </button>
        </div>
      </div>
    </header>
    <nav class="tabs">
      <button class="tab active" data-tab="tasks">Tasks</button>
      <button class="tab" data-tab="timeline">Timeline</button>
      <button class="tab" data-tab="stats">Stats</button>
    </nav>
    <main class="content">
      <div id="tasksPane">
        <div class="filters-row">
          <div class="filters" data-filters></div>
        </div>
        <div class="task-grid" data-grid></div>
      </div>
      <div id="timelinePane" style="display:none">
        <p style="color:var(--text-secondary);text-align:center;padding:3rem">Timeline coming soon.</p>
      </div>
      <div id="statsPane" style="display:none">
        <p style="color:var(--text-secondary);text-align:center;padding:3rem">Stats coming soon.</p>
      </div>
    </main>
  </div>

  <!-- ================= Create/Edit modal (floating dropdown) ================= -->
  <div class="modal-wrap" data-modal>
    <div class="modal">
      <div class="modal-body">
        <h2 class="modal-title" data-modal-title>New task</h2>
        <div class="field">
          <label for="f-title">Title <span class="req">*</span></label>
          <input id="f-title" class="input" data-f-title type="text" placeholder="What needs doing?  e.g. Fix flaky test #working" maxlength="140" />
          <div class="tag-hint"><span class="lbl">Tags:</span><span data-derived></span></div>
          <div class="field-error" data-e-title></div>
        </div>
        <div class="field">
          <label for="f-dir">Target directory</label>
          <div class="dir-row">
            <div class="select-wrap">
              <select id="f-dir" data-f-dir>
                <option value="">— No directory —</option>
                <optgroup label="Git roots"></optgroup>
                <optgroup label="Recent directories"></optgroup>
              </select>
            </div>
            <button class="browse-btn" data-browse title="Browse…" aria-label="Browse…">
              <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            </button>
          </div>
          <div class="dir-note" data-dir-note></div>
          <div class="field-error" data-e-dir></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save>Create task</button>
      </div>
    </div>
  </div>

  <div class="toast" data-toast></div>

<script>
"use strict";
/* ==================== Sample data ==================== */
const DIRS = [
  { kind: "git", label: "kikaraage/shelley", path: "/var/home/ki/.config/shelley/shelley-customization", missing: false },
  { kind: "git", label: "boldsoftware/shelley", path: "/work/boldsoftware/shelley", missing: true },
  { kind: "cwd", label: "~/notes", path: "/home/ki/notes", missing: false },
  { kind: "cwd", label: "~/projects/beads", path: "/home/ki/projects/beads", missing: false },
];
/* Tags live IN the title as #hashtags (per feedback). newest-first in array. */
let TASKS = [
  { id: 1, title: "Fix drawer tag menu clipping #working #revise", cwd: DIRS[0].path, handled: true, thread: "fix-drawer-tag-clipping" },
  { id: 2, title: "Write ADR for task lifecycle #plan", cwd: null, handled: false, thread: null },
  { id: 3, title: "Investigate SSE reconnect flake #explore", cwd: DIRS[1].path, handled: false, thread: null },
  { id: 4, title: "Ship P037: shared TagPicker #done #audit", cwd: DIRS[0].path, handled: true, thread: "ship-p037-tagpicker" },
  { id: 5, title: "Extract TagPicker constant + task modal reuse", cwd: null, handled: true, thread: "extract-tagpicker-constant" },
  { id: 6, title: "Organize notes on Beads research #explore", cwd: DIRS[2].path, handled: false, thread: null },
  { id: 7, title: "Sketch Beads storage API #plan", cwd: DIRS[3].path, handled: false, thread: null },
  { id: 8, title: "Review queue-main-crawshaw PR #done", cwd: DIRS[0].path, handled: false, thread: null },
];
let nextId = 9;

/* ==================== State ==================== */
let filter = "all"; // "all" | dir path | "none"
let editingId = null;
let draftDir = "";

const dirByPath = p => DIRS.find(d => d.path === p) || null;
const taskById = id => TASKS.find(t => t.id === id);
/* Tags derived from the title: #token tokens, deduped, first-seen order (#10 rules). */
function deriveTags(title) {
  const out = [];
  const re = /#([a-zA-Z0-9_-]+)/g;
  let m;
  while ((m = re.exec(title))) if (!out.includes(m[1])) out.push(m[1]);
  return out;
}
const isDone = t => deriveTags(t.title).includes("done");
const groupOf = t => isDone(t) ? "done" : (t.handled ? "handled" : "idle");
/* Display title: hashtags stripped (they're shown as chips instead). */
function displayTitle(t) { return t.title.replace(/#[a-zA-Z0-9_-]+/g, "").trim(); }

/* ==================== Rendering ==================== */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function tagChips(t) {
  return deriveTags(t.title).map(tag =>
    `<span class="tag${tag === "done" ? " done-tag" : ""}"><span class="hash">#</span>${esc(tag)}</span>`
  ).join("");
}
function threadBadge(t) {
  if (!t.thread) return "";
  return `<button class="thread-badge" data-act="thread" data-id="${t.id}" title="Open linked conversation"><span class="arrow">➤</span><span class="slug">${esc(t.thread)}</span></button>`;
}
function cwdLine(t) {
  if (!t.cwd) return "";
  const d = dirByPath(t.cwd);
  const missing = !d ? true : d.missing;
  const label = d ? d.label : t.cwd.split("/").pop() || t.cwd;
  const dot = d && d.kind === "git" ? "git-dot" : "cwd-dot";
  return `<span class="${dot}"></span><span class="dir-name">${esc(label)}</span>${missing ? '<span class="missing-badge">missing</span>' : ""}`;
}
function rowActions(t) {
  return `<button class="icon-btn" data-act="edit" data-id="${t.id}" title="Edit">✎</button>
          <button class="icon-btn" data-act="thread" data-id="${t.id}" title="Start thread (deferred to #14)">➤</button>
          <button class="icon-btn" data-act="del" data-id="${t.id}" title="Delete">🗑</button>`;
}
function rowHTML(t) {
  return `<div class="row ${isDone(t) ? "is-done" : ""}">
    <div class="main">
      <div class="task-title">${esc(displayTitle(t))}</div>
      <div class="meta">${cwdLine(t)}${threadBadge(t)}${tagChips(t)}</div>
    </div>
    <div class="row-actions">${rowActions(t)}</div>
  </div>`;
}

function renderFilters() {
  const pills = [{ key: "all", label: "All" }, ...DIRS.map(d => ({ key: d.path, label: d.label })), { key: "none", label: "No dir" }];
  const count = key => {
    if (key === "all") return TASKS.length;
    if (key === "none") return TASKS.filter(t => !t.cwd).length;
    return TASKS.filter(t => t.cwd === key).length;
  };
  document.querySelector("[data-filters]").innerHTML = pills.map(p => {
    const favicon = (p.key !== "all" && p.key !== "none" && dirByPath(p.key)?.kind === "git")
      ? `<img class="pill-favicon" src="/api/repo-favicon?root=${encodeURIComponent(p.key)}" alt="" onerror="this.style.display='none'">`
      : "";
    return `<button class="filter ${filter === p.key ? "active" : ""}" data-filter="${esc(p.key)}">${favicon}${esc(p.label)} (${count(p.key)})</button>`;
  }).join("");
}

function renderGrid() {
  const q = sel => document.querySelector(sel);
  const inFilter = t => filter === "all" || (filter === "none" ? !t.cwd : t.cwd === filter);
  const list = TASKS.filter(inFilter);
  const grid = q("[data-grid]");

  if (TASKS.length === 0) {
    grid.innerHTML = `<div class="empty-all" style="grid-column:1/-1"><div class="big">No tasks yet</div>
      <div>Tasks you create will show up here.</div>
      <div style="margin-top:1rem"><button class="btn btn-primary" data-open>＋ Create your first task</button></div></div>`;
    return;
  }
  if (list.length === 0) {
    const label = filter === "none" ? "no directory" : (dirByPath(filter)?.label || filter);
    grid.innerHTML = `<div class="empty-all" style="grid-column:1/-1"><div class="big">Nothing here</div><div>No tasks in ${esc(label)}.</div></div>`;
    return;
  }

  const groups = ["handled", "idle", "done"]; // DOM order = mobile order (handled first)
  const section = key => {
    const tasks = list.filter(t => groupOf(t) === key);
    const label = { idle: "idle", handled: "handled", done: "done" }[key];
    const copy = { idle: `${tasks.length} idle items`, handled: `${tasks.length} currently handled`, done: `${tasks.length} tasks done` }[key];
    return `<div class="group group-${key}">
      <div class="group-label">${copy}</div>
      <div class="group-body">${tasks.length ? tasks.map(rowHTML).join("") : `<div class="group-empty">Nothing ${label}</div>`}</div>
    </div>`;
  };
  grid.innerHTML = groups.map(section).join("");
}

function renderAll() { renderFilters(); renderGrid(); }

/* ==================== Modal ==================== */
const modal = document.querySelector("[data-modal]");
const fTitle = document.querySelector("[data-f-title]");
const fDir = document.querySelector("[data-f-dir]");
const saveBtn = document.querySelector("[data-save]");

function populateDirOptions() {
  const git = DIRS.filter(d => d.kind === "git");
  const cwd = DIRS.filter(d => d.kind === "cwd");
  fDir.querySelector('optgroup[label="Git roots"]').innerHTML = git.map(d =>
    `<option value="${esc(d.path)}" ${d.missing ? "disabled" : ""}>${esc(d.label)}${d.missing ? "  (missing on disk)" : ""}</option>`).join("");
  fDir.querySelector('optgroup[label="Recent directories"]').innerHTML = cwd.map(d =>
    `<option value="${esc(d.path)}">${esc(d.label)}</option>`).join("");
}
function renderDerived() {
  const tags = deriveTags(fTitle.value);
  document.querySelector("[data-derived]").innerHTML = tags.length
    ? tags.map(tag => `<span class="tag${tag === "done" ? " done-tag" : ""}"><span class="hash">#</span>${esc(tag)}</span>`).join("")
    : `<span style="color:var(--text-tertiary);font-size:0.75rem">type #tag in the title</span>`;
}
function openModal(id, mode) {
  editingId = mode === "edit" ? id : null;
  document.querySelector("[data-modal-title]").textContent = editingId ? "Edit task" : "New task";
  saveBtn.textContent = editingId ? "Save changes" : "Create task";
  const t = editingId ? taskById(editingId) : null;
  fTitle.value = t ? t.title : "";
  draftDir = t && t.cwd ? t.cwd : "";
  fDir.value = draftDir;
  document.querySelector("[data-dir-note]").textContent = draftDir ? (dirByPath(draftDir)?.label || draftDir) : "";
  document.querySelector("[data-e-title]").textContent = "";
  document.querySelector("[data-e-dir]").textContent = "";
  fTitle.classList.remove("err"); fDir.classList.remove("err");
  renderDerived();
  modal.classList.add("on");
  setTimeout(() => fTitle.focus(), 30);
}
function closeModal() { modal.classList.remove("on"); editingId = null; }

function validate() {
  let ok = true;
  const eT = document.querySelector("[data-e-title]");
  const eD = document.querySelector("[data-e-dir]");
  const title = fTitle.value.trim();
  fTitle.classList.remove("err"); fDir.classList.remove("err");
  eT.textContent = ""; eD.textContent = "";
  if (!title) { eT.textContent = "Title is required."; fTitle.classList.add("err"); ok = false; }
  if (draftDir) {
    const d = dirByPath(draftDir);
    if (!d || d.missing) { eD.textContent = "Directory is missing on disk — pick another."; fDir.classList.add("err"); ok = false; }
  }
  return ok;
}
function save() {
  if (!validate()) return;
  const title = fTitle.value.trim();
  if (editingId) {
    const t = taskById(editingId);
    t.title = title; t.cwd = draftDir;
  } else {
    TASKS.unshift({ id: nextId++, title, cwd: draftDir || null, handled: false, thread: null });
  }
  closeModal(); renderAll();
}

/* ==================== Toast ==================== */
let toastTimer;
function toast(msg) {
  const el = document.querySelector("[data-toast]");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ==================== Events ==================== */
document.addEventListener("click", e => {
  if (e.target.closest("[data-open]")) { openModal(null); return; }
  if (e.target.closest("[data-new-conv]")) { toast("New conversation — placeholder"); return; }
  if (e.target.closest("[data-close]")) { closeModal(); return; }
  if (e.target.closest("[data-save]")) { save(); return; }
  const browse = e.target.closest("[data-browse]");
  if (browse) {
    const next = DIRS.find(d => !d.missing && d.path !== draftDir) || DIRS[0];
    draftDir = next.path;
    fDir.value = draftDir;
    document.querySelector("[data-dir-note]").textContent = next.label;
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    const id = +act.dataset.id;
    if (act.dataset.act === "edit") openModal(id, "edit");
    if (act.dataset.act === "del") { TASKS = TASKS.filter(t => t.id !== id); renderAll(); }
    if (act.dataset.act === "thread") {
      const t = taskById(id);
      toast(`Would open a new thread from "${displayTitle(t)}" — thread-from-task is deferred to #14`);
    }
    return;
  }
  const pill = e.target.closest("[data-filter]");
  if (pill) { filter = pill.dataset.filter; renderAll(); return; }
  /* outside-click closes the dropdown */
  if (!e.target.closest(".modal") && !e.target.closest("[data-open]") && modal.classList.contains("on")) closeModal();
});
fDir.addEventListener("change", () => {
  draftDir = fDir.value;
  document.querySelector("[data-dir-note]").textContent = draftDir ? (dirByPath(draftDir)?.label || draftDir) : "";
});
fTitle.addEventListener("input", renderDerived);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("on")) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openModal(null); }
});

/* ==================== Tabs / theme ==================== */
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
  const tab = b.dataset.tab;
  document.querySelector("#tasksPane").style.display = tab === "tasks" ? "" : "none";
  document.querySelector("#timelinePane").style.display = tab === "timeline" ? "" : "none";
  document.querySelector("#statsPane").style.display = tab === "stats" ? "" : "none";
}));
document.querySelector("[data-theme]").addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
});

/* ==================== Init ==================== */
populateDirOptions();
renderAll();
</script>
</body>
</html>
